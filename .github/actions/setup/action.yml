name: Set up snippet tooling
description: Install Node, the latest stable Python, and pinned SDKs and tooling.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@v7.0.0
      with:
        python-version: "3.x"
        check-latest: true
    - uses: astral-sh/setup-uv@v10.2.0
    - shell: bash
      run: |
        npm ci --ignore-scripts
        uv venv --python $(python --version 2>&1 | sed "s/Python //")
        uv pip sync --python .venv/bin/python src/requirements.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
