name: Set up snippet tooling
description: Install the pinned Node and Python SDKs and development tools.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: npm
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: "3.12"
    - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
    - shell: bash
      run: |
        npm ci --ignore-scripts
        uv venv --python $(python --version 2>&1 | sed "s/Python //")
        uv pip sync --python .venv/bin/python src/requirements.txt
        echo "$PWD/.venv/bin" >> "$GITHUB_PATH"
